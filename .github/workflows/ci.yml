name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: novatip_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    strategy:
      fail-fast: false
      matrix:
        # 20 is what the Dockerfile ships on; 24 is the current LTS line.
        node-version: [20, 24]

    # Used as the shadow database for `prisma migrate diff` below, not by the
    # app or its tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novatip
          POSTGRES_PASSWORD: novatip
          POSTGRES_DB: novatip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novatip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://novatip:novatip@localhost:5432/novatip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # @novatip/sdk installs straight from GitHub and builds itself through its
      # prepare script, so no sibling checkout is needed.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      # Replays prisma/migrations onto the service Postgres above (used only
      # as a scratch shadow database) and diffs the result against
      # schema.prisma. A schema change with no migration, or a hand-edited
      # migration that no longer produces the schema, shows up as a non-empty
      # diff and fails the step instead of surfacing at `migrate deploy` on
      # deploy.
      - name: Check migrations match schema.prisma
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

      - name: Lint
        run: npm run lint

      - name: Check env var docs
        run: npm run check:env-docs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/novatip_test

      - name: Build
        run: npm run build
